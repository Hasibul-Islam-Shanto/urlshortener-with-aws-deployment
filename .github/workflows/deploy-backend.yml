name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read

concurrency:
  group: terraform-prod-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, typecheck, lint, and test
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require repository settings
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          JWT_SECRET: ${{ secrets.TF_VAR_jwt_secret }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Set secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Set secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Set repository variable TF_STATE_BUCKET"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Set secret TF_VAR_jwt_secret (at least 32 characters)"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Package Lambda
        working-directory: backend
        run: npm ci && npm run package:lambda

      - name: Terraform init
        working-directory: terraform/environments/prod
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Update Lambda
        working-directory: terraform/environments/prod
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
        run: terraform apply -input=false -auto-approve
