name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require repository settings
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Set secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Set secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Set repository variable TF_STATE_BUCKET"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Terraform init
        working-directory: terraform/environments/prod
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Read stack outputs
        id: stack
        working-directory: terraform/environments/prod
        run: |
          echo "api_invoke_url=$(terraform output -raw api_invoke_url)" >> "$GITHUB_OUTPUT"
          echo "site_bucket_name=$(terraform output -raw site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.stack.outputs.api_invoke_url }}
        run: npm ci && npm run build

      - name: Upload and invalidate
        env:
          BUCKET: ${{ steps.stack.outputs.site_bucket_name }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
        run: |
          aws s3 sync frontend/dist "s3://${BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
